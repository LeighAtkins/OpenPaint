<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="462" viewBox="75 80 1080 462" role="img" aria-labelledby="front-title front-description">
  <title id="front-title">Lounge PID 3610 — front measurement guide</title>
  <desc id="front-description">Symmetric, straight-on front with shallow depth cues. Level back and narrow arms, with an inset projecting front apron. A1–A3 Back · B1/B2 Inner arm depths · C1 Arm width · C2 Full arm height · C3 Projection · C4 Apron height · D Apron width. Front projection depth emphasized for legibility. No production measurements assigned. Cushions removed.</desc>
  <metadata>{"example":"extended-center-apron-03","view":"front","source":{"kind":"manufacturer","reference":"https://comfort-works.com/products/lounge-73-apartment-sofa-slipcover","notes":["Visual construction study, not a verified cutting pattern or production measurement guide.","Shape checked against PID 3610 / CB-LE-73__SV_PTD__2S-2B / Original VELC_SP / frame image 13497.","PID frame diagram: back and arm tops form one level rim; narrow arms flank the projecting center panel.","Overall dimensions come from the selected catalogue configuration. Cover dimensions inform proportions, not a verified furniture mesh; leg clearance and back thickness remain estimates.","Center apron extends between the arms. Arm faces continue to the lower body edge independently.","Haven has related projecting construction but a different upholstered junction; this is not an exact Haven template."]},"dimensionsVerified":false,"geometry":{"armFront":75.94,"panelFront":91.44,"panelLeft":10,"panelRight":175.42,"deckHeight":29.5,"legHeight":5,"backTopElevation":63.5,"armTopElevation":63.5},"measurements":[{"label":"A1","meaning":"Backrest upper width between inner arm/back joins.","start":[10,10,63.5],"end":[175.42,10,63.5]},{"label":"A2","meaning":"Backrest lower width at the seat/back junction.","start":[10,10,29.5],"end":[175.42,10,29.5]},{"label":"A3","meaning":"Inner back height from top edge to the seat deck.","start":[92.71,10,63.5],"end":[92.71,10,29.5]},{"label":"B1","meaning":"Inner arm depth at deck level, rear join to arm front.","start":[175.42,10,29.5],"end":[175.42,75.94,29.5]},{"label":"B2","meaning":"Inner arm top depth, rear join to front inner corner.","start":[175.42,10,63.5],"end":[175.42,75.94,63.5]},{"label":"C1","meaning":"Front arm cap width between inner and outer corners.","start":[175.42,75.94,63.5],"end":[185.42,75.94,63.5]},{"label":"C2","meaning":"Full front arm height to lower upholstery hem. Here the arm continues beside the apron, not onto a plinth.","start":[180.42,75.94,63.5],"end":[180.42,75.94,5]},{"label":"C3","meaning":"Forward projection from arm face to apron front.","start":[175.42,75.94,29.5],"end":[175.42,91.44,29.5]},{"label":"C4","meaning":"Apron height from deck to lower upholstery hem.","start":[132.4108,91.44,29.5],"end":[132.4108,91.44,5]},{"label":"D","meaning":"Front apron width between its side boundaries.","start":[10,91.44,17.25],"end":[175.42,91.44,17.25]}],"notApplicable":[]}</metadata>
