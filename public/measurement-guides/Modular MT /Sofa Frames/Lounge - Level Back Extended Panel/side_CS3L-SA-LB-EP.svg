  <title id="side-title">Lounge PID 3610 — side measurement guide</title>
  <desc id="side-description">Orthographic side elevation. Level back and narrow arms, with an inset projecting front apron. F3 Back thickness · G1 Arm depth · G2 Overall depth · H1/H2 Body heights · H3 Leg clearance · C3/C4 Apron. F1/F2/F4: not applicable to this level-back shape. F3 inner boundary is inferred; no zero-length arrows.</desc>
  <metadata>{"example":"extended-center-apron-03","view":"side","source":{"kind":"manufacturer","reference":"https://comfort-works.com/products/lounge-73-apartment-sofa-slipcover","notes":["Visual construction study, not a verified cutting pattern or production measurement guide.","Shape checked against PID 3610 / CB-LE-73__SV_PTD__2S-2B / Original VELC_SP / frame image 13497.","PID frame diagram: back and arm tops form one level rim; narrow arms flank the projecting center panel.","Overall dimensions come from the selected catalogue configuration. Cover dimensions inform proportions, not a verified furniture mesh; leg clearance and back thickness remain estimates.","Center apron extends between the arms. Arm faces continue to the lower body edge independently.","Haven has related projecting construction but a different upholstered junction; this is not an exact Haven template."]},"dimensionsVerified":false,"geometry":{"armFront":75.94,"panelFront":91.44,"panelLeft":10,"panelRight":175.42,"deckHeight":29.5,"legHeight":5,"backTopElevation":63.5,"armTopElevation":63.5},"measurements":[{"label":"F3","meaning":"Back top thickness; the inner boundary is inferred in this side elevation.","start":[0,0,63.5],"end":[0,10,63.5]},{"label":"G1","meaning":"Arm top depth, rear edge to front arm face.","start":[0,0,63.5],"end":[0,75.94,63.5]},{"label":"G2","meaning":"Overall lower-body depth, including the projecting apron.","start":[0,0,5],"end":[0,91.44,5]},{"label":"H1","meaning":"Front arm height to the lower upholstery hem; excludes legs.","start":[0,75.94,63.5],"end":[0,75.94,5]},{"label":"H2","meaning":"Rear body height to the lower upholstery hem; excludes legs.","start":[0,0,63.5],"end":[0,0,5]},{"label":"H3","meaning":"Leg clearance from the upholstery hem to the floor.","start":[10,4,5],"end":[10,4,0]},{"label":"C3","meaning":"Forward projection from arm face to apron front.","start":[10,75.94,29.5],"end":[10,91.44,29.5]},{"label":"C4","meaning":"Apron height from deck to lower upholstery hem.","start":[10,91.44,29.5],"end":[10,91.44,5]}],"notApplicable":[{"label":"F1","reason":"No separate raised-back base above the arm; top thickness is shown as F3."},{"label":"F2","reason":"No outer back height above the arm: back and arm tops are level."},{"label":"F4","reason":"No inner back height above the arm: back and arm tops are level."}]}</metadata>
